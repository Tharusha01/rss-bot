version: "3.9"

services:
  rss-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rss_news_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist the SQLite database and logs outside the container
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python main.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
